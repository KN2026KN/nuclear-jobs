name: Odkrywanie źródeł
on:
  workflow_dispatch:
  push:
    paths: ['narzedzia/odkrywanie*.py', '.github/workflows/odkrywanie.yml']
permissions:
  contents: write
jobs:
  odkryj:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests beautifulsoup4 && python3 narzedzia/odkrywanie2.py
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      - name: Zapis
        if: always()
        run: |
          git config user.name keura-robot; git config user.email keura-robot@users.noreply.github.com
          git add data/log/odkrywanie; git commit -m "Odkrywanie źródeł" || true; git pull --rebase -q; git push
