name: Kursy walut i PPP (EBC, Bank Światowy)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python3 kod/kursy.py
      - run: |
          git config user.name "keura-robot"; git config user.email "keura-robot@users.noreply.github.com"
          git add data/kursy.json && git commit -qm "Kursy walut i PPP $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
