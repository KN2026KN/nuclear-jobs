name: Panel statystyk teraz (odbudowa bazy + prywatna strona WP, bez zbierania)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Odszyfrowanie treści ofert (sekret RAW_KEY)
        env: { RAW_KEY: '${{ secrets.RAW_KEY }}' }
        run: pip install --quiet cryptography && python3 kod/szyfr.py odszyfruj
      - run: pip install --quiet requests beautifulsoup4 langdetect
      - env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          DAY=$(ls -d raw/20??-??-?? | tail -1 | xargs basename)
          python3 kod/rebuild_all.py raw /tmp/kp.sqlite > /dev/null
          python3 kod/statystyki.py /tmp/kp.sqlite $DAY /tmp/st.json
          python3 strona/statystyki_publikuj.py /tmp/st.json
