name: Publikacja teraz (baza z raw, strona /praca i statystyki, bez zbierania)
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: nocny
  cancel-in-progress: false
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Odszyfrowanie treści ofert (sekret RAW_KEY)
        env: { RAW_KEY: '${{ secrets.RAW_KEY }}' }
        run: pip install --quiet cryptography && python3 kod/szyfr.py odszyfruj
      - run: pip install --quiet requests beautifulsoup4 openpyxl langdetect
      - name: Diagnostyka logowania WP (bez ujawniania wartości)
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, requests
          u, p = os.environ.get('WP_USER',''), os.environ.get('WP_APP_PASSWORD','')
          print('WP_USER: dl.', len(u), '| @' if '@' in u else '| bez @', '| biale znaki na brzegach' if u != u.strip() else '')
          q = p.replace(' ', '')
          print('WP_APP_PASSWORD: dl. bez spacji', len(q), '(powinno byc 24)', '| biale znaki na brzegach' if p != p.strip() else '', '| tylko litery i cyfry' if q.isalnum() else '| inne znaki')
          for nazwa, au in (('falszywe', ('nieistnieje', 'aaaa bbbb cccc dddd eeee ffff')), ('sekret', (u.strip(), p.strip()))):
              r = requests.get('https://keura.eu/wp-json/wp/v2/pages/7194?context=edit&_fields=id', auth=au, headers={'User-Agent': 'keura-robot/1.0 (+https://keura.eu)'}, timeout=60)
              print('TEST', nazwa, r.status_code, r.text[:160].replace(chr(10), ' '))
          for url in ('https://keura.eu/wp-json/wp/v2/users/me?context=edit', 'https://keura.eu/wp-json/wp/v2/pages/7194?context=edit&_fields=id,status'):
              for ua in ({'User-Agent': 'keura-robot'}, {'User-Agent': 'Mozilla/5.0 (keura-robot)'}):
                  r = requests.get(url, auth=(u.strip(), p.strip()), headers=ua, timeout=60)
                  ct = r.headers.get('content-type','')
                  print(url.split('/v2/')[1][:20], ua['User-Agent'][:12], r.status_code, (r.json().get('code') if 'json' in ct and isinstance(r.json(), dict) else r.text[:60].replace(chr(10),' ')))
          PY
      - name: Baza, strona i statystyki
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -o pipefail
          DAY=$(ls data/dzien | grep -E '^[0-9-]{10}\.json$' | tail -1 | cut -c1-10)
          mkdir -p data/log data/statystyki
          python3 kod/rebuild_all.py raw /tmp/kp.sqlite > /dev/null
          python3 kod/strona_praca.py /tmp/kp.sqlite $DAY /tmp/praca.html /tmp/praca_en.html
          python3 strona/praca_publikuj.py /tmp/praca.html /tmp/praca_en.html
          python3 kod/statystyki.py /tmp/kp.sqlite $DAY data/statystyki/$DAY.json
          python3 strona/statystyki_publikuj.py data/statystyki/$DAY.json
