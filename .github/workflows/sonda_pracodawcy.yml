name: Sonda potencjalnych pracodawców
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: pip install -q requests beautifulsoup4
      - run: python3 narzedzia/sonda_pracodawcy.py data/pracodawcy/kandydaci.tsv data/pracodawcy/sonda.json
      - run: |
          git config user.name "keura-robot"; git config user.email "keura-robot@users.noreply.github.com"
          git add data/pracodawcy; git commit -qm "Sonda potencjalnych pracodawców" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
